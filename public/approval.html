<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Autorização · ArtiSys Oficina</title>
<link rel="stylesheet" href="/approval.css"><script defer src="/approval.js"></script></head>
<body><main class="approval-shell"><div class="brand">ArtiSys <strong>Oficina</strong></div>
<section class="approval-card"><header><p class="eyebrow">ORÇAMENTO</p><h1>Aprovação de serviço</h1><p>Confira os itens antes de autorizar a execução.</p></header>
<p id="notice" class="notice" role="status">Carregando orçamento...</p><button id="retry" type="button" class="secondary" hidden>Consultar situação novamente</button>
<div id="proposal" hidden><p id="order-number"></p><div id="items"></div><div class="total"><span>Total</span><strong id="total"></strong></div>
<p id="expiry" class="muted"></p><label for="reason">Motivo da reprovação, se necessário</label>
<textarea id="reason" rows="3" maxlength="500"></textarea><div class="actions">
<button id="reject" type="button" class="secondary">Reprovar</button><button id="approve" type="button" class="primary">Aprovar orçamento</button></div>
<p class="muted">Este link tem prazo e só permite uma decisão.</p></div></section></main></body></html>
