name: Oficina - emitir recuperacao Douglas uma vez
on:
  push:
    branches: [qa/send-douglas-recovery-once-20261119]
    paths: ['.github/workflows/qa-douglas-recovery-once.yml']
jobs:
  request-password-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Emitir codigo OTP por e-mail via Central Cloudflare, uma vez
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json
          url='https://pdv-artisys.sistema-artisys.workers.dev/v1/password-recovery/request'
          body=json.dumps({
            'email':'douglasuparnan@gmail.com',
            'installationId':'oficina-7e90f533-237f-4e9b-921b-6ad8327611e0'
          }).encode()
          req=urllib.request.Request(url,data=body,headers={
             'Content-Type':'application/json',
             'User-Agent':'ArtiSys-Oficina-recovery/1.0'
          },method='POST')
          try:
            with urllib.request.urlopen(req,timeout=30) as response:
              data=json.load(response)
              assert response.status==202 and data.get('accepted') is True,(response.status,data)
              assert 'code' not in data
              print('Código solicitado e aceito pela Central; verificar D1 relayed_at para entrega.')
          except urllib.error.HTTPError as e:
            print('Falha HTTP:',e.code,e.read().decode(errors='replace')[:300])
            raise
          PY
