name: ArtiSys QA · Etapa 07

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'qa/**'
      - 'scripts/qa-demo.mjs'
      - 'scripts/seed-qa-demo.mjs'
      - 'tests/**'
      - 'src/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  visual-shell:
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout ArtiSys Oficina
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install app and local Playwright
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Seed isolated QA database
        run: |
          rm -rf .qa
          DATABASE_PATH=.qa/artisys-oficina.sqlite STORAGE_DIR=.qa/uploads EVENT_LOG_PATH=.qa/events.jsonl NODE_ENV=development node scripts/seed-qa-demo.mjs

      - name: Browser QA with guaranteed local server shutdown
        run: |
          node scripts/qa-demo.mjs ${{ matrix.viewport }} "$PWD/qa-artifacts"

      - name: Upload QA screenshots, video and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artisys-oficina-stage7-${{ matrix.viewport }}-${{ github.run_number }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7
