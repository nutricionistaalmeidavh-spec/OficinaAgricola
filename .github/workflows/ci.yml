name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Probe public RFB and NF-e endpoints (metadata only)
        shell: python
        run: |
          import urllib.request,re
          for url in [
            'https://portalunico.siscomex.gov.br/classif/api/publico/nomenclatura/download/json',
            'https://www.nfe.fazenda.gov.br/portal/listaConteudo.aspx?tipoConteudo=%2FNJarYc9nus%3D',
            'https://dfe-portal.svrs.rs.gov.br/CFF/ClassificacaoTributaria',
            'https://dfe-portal.svrs.rs.gov.br/Nfag/Documentos'
          ]:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=18) as r:
                data=r.read(3000000)
                print('OFFICIAL_SOURCE',r.status,r.geturl(),r.headers.get('Content-Type'),'BYTES',len(data))
                if 'nfe.fazenda' in url:
                  html=data.decode('utf-8','replace')
                  print('OFFICIAL_FILES',[m for m in re.findall(r'href=["\\x27]([^"\\x27]+)',html,re.I) if 'exibirArquivo' in m][:8])
                elif 'svrs.rs.gov.br' in url:
                  html=data.decode('utf-8','replace')
                  print('OFFICIAL_SCRIPTS',re.findall(r'<script[^>]+src=["\\x27]([^"\\x27]+)',html,re.I)[-30:])
                  for key in ['ExportarJSON','ExportarCsv','csv','json','Download','ClassTrib','classTrib']:
                    print('FOUND_KEY',key,[html[max(0,i-150):i+150] for i in [html.find(key)] if i>=0][:1])
                else:
                  import json
                  payload=json.loads(data)
                  rows=payload.get('Nomenclaturas',[])
                  print('RFB_COUNTS',len(rows),'8_DIGITS',sum(1 for x in rows if len(str(x.get('Codigo','')))==8),'FIELDS',list(rows[0])[:10])
                  print('RFB_EXAMPLES',[x.get('Codigo') for x in rows[:3]])

            except Exception as e:print('OFFICIAL_SOURCE_ERROR',type(e).__name__,str(e)[:300])
          from urllib.parse import quote
          import io,zipfile
          file='Tabela IT 2025.002 v.1.71 - cClassTrib.xlsx'
          url='https://dfe-portal.svrs.rs.gov.br/DFE/DownloadArquivoEstatico/?sistema=DFE&tipoArquivo=12&nomeArquivo='+quote(file)
          try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as r:
              data=r.read(8000000)
              print('SVRS_XLSX_DOWNLOAD',r.status,len(data),r.headers.get('Content-Type'),'PREFIX',data[:14])
              if data.startswith(b'PK'):
                with zipfile.ZipFile(io.BytesIO(data)) as z:
                  print('SVRS_ZIP_MEMBERS',z.namelist()[:22])
                  import xml.etree.ElementTree as ET
                  ns={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
                  share=ET.fromstring(z.read('xl/sharedStrings.xml'))
                  strings=[''.join(t.text or '' for t in e.findall('.//m:t',ns)) for e in share.findall('m:si',ns)]
                  for sheet in ['xl/worksheets/sheet1.xml','xl/worksheets/sheet2.xml','xl/worksheets/sheet3.xml','xl/worksheets/sheet4.xml']:
                    root=ET.fromstring(z.read(sheet))
                    rows=root.findall('.//m:sheetData/m:row',ns)
                    samples=[]
                    for row in rows[:10]:
                      vals=[]
                      for cell in row.findall('m:c',ns)[:22]:
                        v=cell.find('m:v',ns)
                        raw=(v.text if v is not None else '') or ''
                        if cell.get('t')=='s' and raw.isdigit() and int(raw)<len(strings):raw=strings[int(raw)]
                        if raw: vals.append((cell.get('r'),raw[:60]))
                      samples.append(vals)
                    print('SVRS_SHEET',sheet,'ROWS',len(rows),'HEAD',samples[:7])
          except Exception as e:print('SVRS_XLSX_ERROR',type(e).__name__,str(e)[:400])
          class RedirectInspector(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,newurl):
              print('NF_PORTAL_REDIRECT',code,'TO',newurl[:200],'COOKIE',headers.get('Set-Cookie','')[:100])
              return None
          redirect=urllib.request.build_opener(RedirectInspector())
          for host in ['https://www.nfe.fazenda.gov.br','https://hom.nfe.fazenda.gov.br']:
            for cookies in ['', 'AspxAutoDetectCookieSupport=1']:
              url=host+'/portal/listaConteudo.aspx?AspxAutoDetectCookieSupport=1&tipoConteudo=%2FNJarYc9nus%3D'
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cookie':cookies})
                with redirect.open(req,timeout=12) as r:
                  data=r.read(1000000)
                  print('NF_PORTAL_OK',r.status,len(data),r.geturl()[:140])
              except Exception as e:print('NF_PORTAL_RESULT',type(e).__name__,str(e)[:120])

      - name: Lint
        run: npm run lint
      - name: ACBrLib Python syntax and offline unit tests
        run: |
          python3 -m py_compile src/platform/acbrlib-worker.py src/platform/diagnostic-worker.py
          python3 -m unittest discover -s tests/python -p 'test_*.py'
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Critical E2E
        run: npm run test:e2e
