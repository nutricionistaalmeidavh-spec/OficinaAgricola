name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate packaged national NFS-e SDK
        run: node scripts/stage-nfse-national.mjs
      - name: Lint
        run: npm run lint
      - name: ACBrLib Python syntax and offline unit tests
        run: |
          python3 -m py_compile src/platform/acbrlib-worker.py src/platform/diagnostic-worker.py
          python3 -m unittest discover -s tests/python -p 'test_*.py'
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify official fiscal data bundled in dist
        run: node scripts/assert-fiscal-data-bundle.mjs --dist
      - name: Critical E2E
        run: npm run test:e2e

  windows-nfse-bundle:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install OSS dependencies
        run: npm ci
      - name: Validate Windows NFS-e offline bundle
        run: node scripts/stage-nfse-national.mjs
