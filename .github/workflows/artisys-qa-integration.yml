name: ArtiSys QA · Integração 00-08

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22.16
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Quality gate
        run: npm run ci

  artisys-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    steps:
      - name: Checkout Oficina Agro
        uses: actions/checkout@v4
      - name: Node 22.16
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Run ArtiSys QA shell
        uses: nutricionistaalmeidavh-spec/utilidades/.github/actions/artisys-qa@245ca2cef8678813eee83353beae91f6ad263c56
        with:
          config: qa/artisys-qa.config.json
          mode: run
          flow: stage7-shell
          viewport: ${{ matrix.viewport }}
          output: qa-artifacts-${{ matrix.viewport }}
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oficina-agro-00-08-${{ matrix.viewport }}-${{ github.run_number }}
          path: qa-artifacts-${{ matrix.viewport }}
          if-no-files-found: warn
          retention-days: 7
