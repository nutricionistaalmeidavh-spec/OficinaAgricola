name: ArtiSys QA · Demo + Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-demo:
    if: ${{ !contains(github.event.head_commit.message, '[release-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22.16
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Seed deterministic demo data
        run: |
          rm -rf .qa
          DATABASE_PATH=.qa/oficina.sqlite node scripts/seed-qa-demo.mjs
      - name: Run QA demo with video
        run: node scripts/qa-demo.mjs ${{ matrix.viewport }} qa-artifacts-${{ matrix.viewport }}
      - name: Convert QA video to iOS-compatible MP4
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -y \
            -i qa-artifacts-${{ matrix.viewport }}/qa-video.webm \
            -c:v libx264 \
            -preset medium \
            -crf 20 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            qa-artifacts-${{ matrix.viewport }}/qa-video.mp4
      - name: Upload QA video and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oficina-agro-qa-${{ matrix.viewport }}-${{ github.run_number }}
          path: qa-artifacts-${{ matrix.viewport }}
          if-no-files-found: error
          retention-days: 7

  windows-installer:
    needs: qa-demo
    if: ${{ always() && !contains(github.event.head_commit.message, '[qa-video-only]') && (needs.qa-demo.result == 'success' || contains(github.event.head_commit.message, '[release-only]')) }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22.16
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Install Electron packager
        shell: powershell
        run: npm install --no-save --package-lock=false electron-builder@26.15.3
      - name: Generate Windows x64 installer
        shell: powershell
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Installer checksum
        shell: powershell
        run: |
          $exe = Get-ChildItem '.\dist-electron\OficinaAgro-Setup-*-Windows-x64.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Instalador não encontrado.' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "FILE=$($exe.Name)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "SIZE=$($exe.Length)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "SHA256=$hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "$hash  $($exe.Name)" | Out-File -FilePath '.\dist-electron\SHA256.txt' -Encoding ascii
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OficinaAgro-Windows-x64-${{ github.run_number }}
          path: |
            dist-electron/OficinaAgro-Setup-*-Windows-x64.exe
            dist-electron/SHA256.txt
          if-no-files-found: error
          retention-days: 14
