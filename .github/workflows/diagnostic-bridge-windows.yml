name: Windows · Ponte diagnóstico offline

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - 'src/platform/diagnostic-worker.py'
      - 'src/platform/diagnostic-hardware.js'
      - 'scripts/build-diagnostic-bridge.ps1'
      - 'scripts/requirements-diagnostic-bridge.txt'
      - 'tests/diagnostic-runtime-packaging.test.js'
      - '.github/workflows/diagnostic-bridge-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/platform/diagnostic-worker.py'
      - 'src/platform/diagnostic-hardware.js'
      - 'scripts/build-diagnostic-bridge.ps1'
      - 'scripts/requirements-diagnostic-bridge.txt'
      - 'electron-builder.yml'
      - 'tests/diagnostic-runtime-packaging.test.js'
      - '.github/workflows/diagnostic-bridge-windows.yml'

permissions:
  contents: read

concurrency:
  group: diagnostic-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-bridge:
    name: Python embutido + CAN sem instalador externo
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Validar sintaxe do script de build
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/build-diagnostic-bridge.ps1').Path,
            [ref]$tokens,[ref]$errors
          ) | Out-Null
          if ($errors.Count) { throw "PowerShell inválido: $($errors | Out-String)" }
      - name: Compilar runtime autônomo e conferir CAN embarcado sem Python no PATH
        shell: pwsh
        run: ./scripts/build-diagnostic-bridge.ps1
      - name: Confirmar arquivos e Python integrado
        shell: pwsh
        run: |
          $folder = Resolve-Path 'build/diagnostics/ArtiSys-Diagnostic-Bridge'
          $exe = Join-Path $folder 'ArtiSys-Diagnostic-Bridge.exe'
          if (-not (Test-Path $exe)) { throw 'Bridge.exe não foi produzido' }
          if (-not (Test-Path (Join-Path $folder '_internal'))) {
            throw 'Runtime Python não acompanha o executável'
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host "PASS: ponte compilada e autocontida. SHA256: $hash"
