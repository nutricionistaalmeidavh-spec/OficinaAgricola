name: QA one-shot Oficina Cloudflare email
on:
  push:
    branches: [qa/cloudflare-email-relay-live-20261119]
jobs:
  smoke-live-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request real OTP to ArtiSys's own QA mailbox
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          url='https://pdv-artisys.sistema-artisys.workers.dev/v1/password-recovery/request'
          body=json.dumps({'email':'contato@artisys.dev','installationId':'oficina-qa-relay-20261119'}).encode()
          request=urllib.request.Request(url,data=body,method='POST',headers={
            'Content-Type':'application/json','User-Agent':'ArtiSys-Oficina-QA/1.0'
          })
          try:
            with urllib.request.urlopen(request,timeout=25) as answer:
              response=json.load(answer)
              assert answer.status==202 and response.get('accepted') is True,(answer.status,response)
              assert 'code' not in response,'Code must never be returned via API'
              print('Live OTP accepted; delivery will be validated via Hostinger inbox and D1 relay audit.')
          except urllib.error.HTTPError as error:
            print('Central response status:',error.code,flush=True)
            print('Central response:',error.read().decode('utf8','replace')[:300],flush=True)
            raise
          PY
