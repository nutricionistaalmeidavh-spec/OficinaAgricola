name: Compat fiscal PR45 with main
on:
  push:
    branches: [feat/fiscal-onboarding-integrado-20261105]
    paths: [.github/workflows/fiscal-pr45-compat.yml]
permissions:
  contents: write
jobs:
  merge-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fiscal branch and full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Integrate current main preserving main for intersecting hunks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "MAIN_SHA=$(git rev-parse origin/main)"
          echo "PR_SHA=$(git rev-parse HEAD)"
          if ! git merge --no-ff --no-commit -X theirs origin/main; then
            echo "UNRESOLVED_FILES"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          # A main já tem uma linha antiga com espaço final no modal fiscal.
          # Normalização sem mudança semântica antes do gate de whitespace.
          sed -i 's/[[:blank:]]*$//' public/app-fiscal.js
          git add public/app-fiscal.js
          git diff --cached --check
          for file in src/platform/fiscal-data/catalog.json src/platform/fiscal-official-catalog.js src/platform/fiscal-tax-assist.js src/platform/fiscal-nfse-preparer.js scripts/assert-fiscal-data-bundle.mjs scripts/sync-official-fiscal-catalog.py; do
            test -s "$file" || { echo "Missing fiscal integration file $file"; exit 1; }
          done
          node --check public/app-fiscal.js
          node --check src/platform/acbrlib-fiscal-provider.js
          echo "MERGE_INDEX_OK"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: ACBr Python compilation and regression
        run: |
          python3 -m py_compile src/platform/acbrlib-worker.py src/platform/diagnostic-worker.py
          python3 -m unittest discover -s tests/python -p 'test_*.py'
      - name: Unit tests and fiscal regression
        run: npm test
      - name: Build and canonical fiscal catalogue in dist
        run: |
          npm run build
          node scripts/assert-fiscal-data-bundle.mjs --dist
      - name: Critical user journeys E2E
        run: npm run test:e2e
      - name: Commit conflict resolution and push PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "merge: compatibilizar fiscal PR45 com main após regressão"
          git push origin HEAD:feat/fiscal-onboarding-integrado-20261105
          echo "COMPAT_MERGED_BRANCH_SHA=$(git rev-parse HEAD)"
