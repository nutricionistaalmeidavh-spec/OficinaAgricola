name: Fiscal public sources connectivity probe
on:
  push:
    branches: [feat/fiscal-onboarding-integrado-20261105]
    paths:
      - .github/workflows/fiscal-official-source-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe official public endpoints, metadata only
        shell: python
        run: |
          import urllib.request, urllib.error, re
          urls = [
            'https://portalunico.siscomex.gov.br/classif/api/publico/nomenclatura/download/json',
            'https://www.nfe.fazenda.gov.br/portal/listaConteudo.aspx?tipoConteudo=%2FNJarYc9nus%3D'
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=20) as r:
                data=r.read(5000000)
                print('SOURCE',r.status,r.geturl(),'TYPE',r.headers.get('Content-Type'),'BYTES',len(data))
                if 'nfe.fazenda' in url:
                  html=data.decode('utf-8','replace')
                  for m in re.findall(r'<a[^>]+href=["\x27]([^"\x27]+)',html,flags=re.I)[:80]:
                    if 'exibirArquivo' in m or 'download' in m:print('FILE',m)
                  for key in ['30/10/2026','04/09/2026','Tabela de Classifica','Tabela de CFOP']:
                    print('MATCH',key,html.find(key))
                else:print('NCM-PREFIX',data[:160])
            except Exception as e:print('ERROR',url,type(e).__name__,str(e)[:250])
