name: Reproduzir initdb Unicode - diagnostico
on:
  push:
    branches: ['fix/windows-initdb-unicode-path']
  workflow_dispatch:
jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Baixar instalador comercial real v1.0.5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Path downloaded -Force | Out-Null
          gh release download v1.0.5 --pattern 'ArtiSys-Oficina-Setup-1.0.5-Windows-x64-Commercial.exe' --dir downloaded
          if($LASTEXITCODE -ne 0){throw 'Download falhou'}
          $installer=(Get-ChildItem downloaded -Filter '*.exe' | Select-Object -First 1).FullName
          $installDir=Join-Path $env:RUNNER_TEMP 'OficinaCommercial'
          $p=Start-Process -FilePath $installer -ArgumentList @('/S',"/D=$installDir") -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Installer exit $($p.ExitCode)"}
      - name: Testar initdb caminhos ASCII e nome acentuado + espaços
        shell: pwsh
        run: |
          $exe=Join-Path $env:RUNNER_TEMP 'OficinaCommercial/resources/postgresql/bin/initdb.exe'
          if(-not(Test-Path -LiteralPath $exe)){throw 'initdb ausente'}
          $secret='PasswordSafeABC123'
          $caseRoot=Join-Path $env:RUNNER_TEMP 'initdb-unicode-repro'
          New-Item -ItemType Directory -Path $caseRoot -Force | Out-Null
          $cases=@(
            @{ name='ascii-control'; root=(Join-Path $caseRoot 'ascii'); pwUnicode=$false },
            @{ name='unicode-password'; root=(Join-Path $caseRoot 'Deus e fiél'); pwUnicode=$true },
            @{ name='unicode-data-only'; root=(Join-Path $caseRoot 'Cliente José'); pwUnicode=$false }
          )
          foreach($scenario in $cases){
            $folder=$scenario.root
            $data=Join-Path $folder 'postgres/cluster'
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
            $pwBase=if($scenario.pwUnicode){$folder}else{$caseRoot}
            $pw=Join-Path $pwBase ("senha-"+$scenario.name+".txt")
            Set-Content -LiteralPath $pw -Value $secret -NoNewline -Encoding utf8NoBOM
            Write-Host "CASE: $($scenario.name)"
            $output= & $exe -D $data -U oficina_local_owner --encoding=UTF8 --auth-host=scram-sha-256 --auth-local=scram-sha-256 "--pwfile=$pw" --no-instructions 2>&1
            $exit=$LASTEXITCODE
            $output | ForEach-Object {Write-Host "initdb: $_"}
            Write-Host "RESULT $($scenario.name): $exit"
            if($scenario.name -eq 'ascii-control' -and $exit -ne 0){throw 'Control case failed: binary issue not Unicode'}
            if($scenario.name -ne 'ascii-control' -and $exit -ne 0){Write-Host "REPRODUCED_FAILURE $($scenario.name)"}
            Remove-Item -LiteralPath $pw -Force
          }
      - name: Diagnosticar dependencias do pacote PostgreSQL
        shell: pwsh
        run: |
          $bin=Join-Path $env:RUNNER_TEMP 'OficinaCommercial/resources/postgresql/bin'
          foreach($dll in @('vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll','libcrypto-3-x64.dll')){
            Write-Host "DLL $dll no-pacote=$(Test-Path (Join-Path $bin $dll)) no-windows=$(Test-Path (Join-Path $env:WINDIR 'System32' $dll))"
          }
      - name: Testar aplicativo real em perfil com acento
        shell: pwsh
        run: |
          $exe=Join-Path $env:RUNNER_TEMP 'OficinaCommercial/ArtiSys Oficina.exe'
          $env:LOCALAPPDATA=Join-Path $env:RUNNER_TEMP 'Cliente Deus e fiél'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $p=Start-Process -FilePath $exe -PassThru
          $ready=$false
          for($i=0;$i -lt 80;$i++){
            Start-Sleep -Milliseconds 350
            if($p.HasExited){break}
            try{
              $health=Invoke-RestMethod 'http://127.0.0.1:3344/api/health' -TimeoutSec 1
              if($health.ok -and $health.engine -eq 'postgres'){$ready=$true;break}
            }catch{}
          }
          $cluster=Join-Path $env:LOCALAPPDATA 'ArtiSys/Oficina/postgres/cluster/PG_VERSION'
          Write-Host "Unicode real app: ready=$ready clusterVersion=$(Test-Path $cluster)"
          if(-not $ready){
            $root=Join-Path $env:LOCALAPPDATA 'ArtiSys/Oficina/postgres'
            $pglog=Join-Path $root 'postgres.log'
            $config=Join-Path $root 'connection.json'
            $pending=Join-Path $root 'bootstrap.pending.json'
            Write-Host "Diagnostics: connection=$(Test-Path $config), pending=$(Test-Path $pending), pglog=$(Test-Path $pglog), processExited=$($p.HasExited)"
            if(Test-Path $config){
              $cfg=Get-Content -LiteralPath $config -Raw | ConvertFrom-Json
              Write-Host "Configured PG port: $($cfg.port)"
            }
            if(Test-Path $pglog){Get-Content -LiteralPath $pglog -Tail 35 | ForEach-Object { Write-Host "PGLOG: $_" }}
            throw 'Unicoded application bootstrap failed'
          }
      - name: Encontrar redistribuiveis oficiais MSVC no builder
        shell: pwsh
        run: |
          $base='C:\Program Files\Microsoft Visual Studio\2022'
          Get-ChildItem $base -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $redist=Join-Path $_.FullName 'VC/Redist/MSVC'
            if(Test-Path $redist){
              Get-ChildItem $redist -Directory | ForEach-Object {
                $dir=Join-Path $_.FullName 'x64/Microsoft.VC143.CRT'
                Write-Host "REDIST_PATH=$dir exists=$(Test-Path $dir)"
                if(Test-Path $dir){Get-ChildItem $dir -Filter '*.dll' | ForEach-Object {Write-Host "REDIST_DLL=$($_.Name)"}}
              }
            }
          }
