name: Windows · Instalador limpo

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'electron-builder.yml'
      - 'scripts/build.mjs'
      - 'scripts/smoke-installer.ps1'
      - 'scripts/build-acbr-native.ps1'
      - 'scripts/build-diagnostic-bridge.ps1'
      - 'scripts/requirements-diagnostic-bridge.txt'
      - 'scripts/stage-fiscal-bundle.mjs'
      - 'scripts/stage-postgres-windows.mjs'
      - 'scripts/smoke-postgres-portable.ps1'
      - 'src/platform/postgres-windows-bundle.js'
      - 'src/platform/postgres-local-instance.js'
      - 'src/platform/fiscal-bundle.js'
      - 'public/**'
      - 'tests/**'
      - '.github/workflows/windows-installer-smoke.yml'

concurrency:
  group: windows-install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-clean-install:
    name: NSIS · Windows x64 limpo
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Quality gate
        run: npm run ci
      - name: Validar parser PowerShell antes da compilação nativa
        shell: pwsh
        run: |
          foreach ($script in @('scripts/smoke-postgres-portable.ps1','scripts/smoke-installer.ps1','scripts/build-acbr-native.ps1','scripts/build-electron.ps1','scripts/build-diagnostic-bridge.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw "Erro de sintaxe PowerShell: $script" }
          }
      - name: Build application files
        run: npm run build
      - name: Python 3.12 apenas no builder (não no cliente)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar worker fiscal autônomo
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --console --name acbrlib-worker --distpath build/fiscal-worker --workpath build/pyinstaller-tmp --specpath build/pyinstaller-src src/platform/acbrlib-worker.py
          $response = & ./build/fiscal-worker/acbrlib-worker.exe --self-test | ConvertFrom-Json
          if (-not $response.ok -or -not $response.frozen) { throw 'Worker ACBr não é executável autônomo' }
      - name: Instalar compilador open source Lazarus/FPC + SVN
        shell: pwsh
        run: |
          # Chocolatey community feed occasionally returns HTTP 504. Do not
          # pretend the compiler was installed if all attempts fail.
          $lazarusReady = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install lazarus --version=4.0.0 -y --no-progress
            if ($LASTEXITCODE -eq 0) { $lazarusReady = $true; break }
            Write-Warning "Lazarus 4.0.0 download failed (attempt $attempt/3)."
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $lazarusReady) { throw 'Falha ao instalar Lazarus/FPC no builder após 3 tentativas' }
          if (-not (Get-Command svn -ErrorAction SilentlyContinue)) {
            choco install sliksvn --version=1.14.5 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar cliente SVN OSS' }
          }
          $svnDir = 'C:\\Program Files\\SlikSvn\\bin'
          if (Test-Path (Join-Path $svnDir 'svn.exe')) {
            $env:PATH = "$svnDir;$env:PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $svnDir
          }
          svn --version --quiet
          if ($LASTEXITCODE -ne 0) { throw 'svn CLI indisponível no builder Windows' }
      - name: Compilar ACBrLib NF-e e NFS-e de fontes oficiais LGPL
        shell: pwsh
        run: ./scripts/build-acbr-native.ps1 -Revision 48608
      - name: Verificar DLLs reais e montar bundle autocontido
        shell: pwsh
        run: |
          foreach ($lib in @('ACBrNFe64.dll','ACBrNFSe64.dll')) {
            $response = & ./build/fiscal-worker/acbrlib-worker.exe --probe "build/fiscal-native/$lib" | ConvertFrom-Json
            if (-not $response.ok) { throw "DLL sem exportações ACBr válidas: $lib" }
          }
          node scripts/stage-fiscal-bundle.mjs
      - name: Install temporary Electron builder
        run: npm install --no-save --package-lock=false electron-builder@26.15.3
      - name: Build bundled diagnostic bridge
        shell: pwsh
        run: ./scripts/build-diagnostic-bridge.ps1
      - name: Preparar binários PostgreSQL 16 OSS somente no builder
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\PostgreSQL\16\bin\initdb.exe')) {
            choco install postgresql16 --version=16.15.5 -y --no-progress --params '/NoPath'
            if ($LASTEXITCODE -ne 0) { throw 'Falha PostgreSQL 16 no builder Windows' }
          }
          node scripts/stage-postgres-windows.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Falha staging PostgreSQL Windows offline' }
      - name: Preparar edição livre e manifesto de licenciamento
        run: node scripts/stage-oficina-edition.mjs
      - name: Build Windows NSIS without publishing
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Run fresh install and first-login smoke
        shell: pwsh
        run: ./scripts/smoke-installer.ps1
      - name: Smoke PostgreSQL offline pós-instalação Windows (sem terminal do cliente)
        shell: pwsh
        run: ./scripts/smoke-postgres-portable.ps1
      - name: Confirmar tag da main e versão do instalador
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          git fetch --depth=1 origin main
          if ((git rev-parse HEAD) -ne (git rev-parse FETCH_HEAD)) {
            throw 'A release deve apontar exatamente para a main validada'
          }
          $appVersion = node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version"
          if ($env:GITHUB_REF_NAME -ne "v$appVersion") {
            throw "Tag $env:GITHUB_REF_NAME diverge do package.json ($appVersion)"
          }
      - name: Gerar SHA256 do instalador aprovado
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'dist-electron/ArtiSys-Oficina-Setup-*-Windows-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Instalador de release ausente' }
          $sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha256  $($installer.Name)" | Set-Content -LiteralPath ($installer.FullName + '.sha256') -Encoding ascii -NoNewline
      - name: Guardar instalador e checksum após todos os smokes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: oficina-release-${{ github.ref_name }}
          path: |
            dist-electron/ArtiSys-Oficina-Setup-*-Windows-x64.exe
            dist-electron/ArtiSys-Oficina-Setup-*-Windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 7

  publish-verified-release:
    name: Publicar versão verificada no GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-clean-install
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Baixar artefatos aprovados
        uses: actions/download-artifact@v4
        with:
          name: oficina-release-${{ github.ref_name }}
          path: release
      - name: Publicar somente versão e SHA256 aprovados
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $installer = Get-ChildItem 'release/ArtiSys-Oficina-Setup-*-Windows-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Instalador não encontrado' }
          $checksum = $installer.FullName + '.sha256'
          if (-not (Test-Path -LiteralPath $checksum)) { throw 'SHA256 ausente' }
          $expected = ((Get-Content -LiteralPath $checksum -Raw) -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'SHA256 do artefato divergente' }
          gh release create $env:GITHUB_REF_NAME $installer.FullName $checksum --verify-tag --title "ArtiSys Oficina $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar GitHub Release' }
