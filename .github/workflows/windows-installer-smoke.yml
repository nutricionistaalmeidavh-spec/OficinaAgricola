name: Windows · Instalador limpo

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'electron-builder.yml'
      - 'scripts/build.mjs'
      - 'scripts/smoke-installer.ps1'
      - 'scripts/build-diagnostic-bridge.ps1'
      - 'scripts/requirements-diagnostic-bridge.txt'
      - 'scripts/stage-postgres-windows.mjs'
      - 'scripts/smoke-postgres-portable.ps1'
      - 'src/platform/postgres-windows-bundle.js'
      - 'src/platform/postgres-local-instance.js'
      - 'public/**'
      - 'tests/**'
      - '.github/workflows/windows-installer-smoke.yml'

concurrency:
  group: windows-install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-clean-install:
    name: NSIS · Windows x64 limpo
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Quality gate
        run: npm run ci
      - name: Validar parser PowerShell antes da compilação nativa
        shell: pwsh
        run: |
          foreach ($script in @('scripts/smoke-postgres-portable.ps1','scripts/smoke-installer.ps1','scripts/build-electron.ps1','scripts/build-diagnostic-bridge.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw "Erro de sintaxe PowerShell: $script" }
          }
      - name: Build application files
        run: npm run build
      - name: Install temporary Electron builder
        run: npm install --no-save --package-lock=false electron-builder@26.15.3
      - name: Build bundled diagnostic bridge
        shell: pwsh
        run: ./scripts/build-diagnostic-bridge.ps1
      - name: Preparar binários PostgreSQL 16 OSS somente no builder
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\PostgreSQL\16\bin\initdb.exe')) {
            choco install postgresql16 --version=16.15.5 -y --no-progress --params '/NoPath'
            if ($LASTEXITCODE -ne 0) { throw 'Falha PostgreSQL 16 no builder Windows' }
          }
          node scripts/stage-postgres-windows.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Falha staging PostgreSQL Windows offline' }
      - name: Preparar edição livre e manifesto de licenciamento
        run: node scripts/stage-oficina-edition.mjs
      - name: Build Windows NSIS without publishing
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Run fresh install and first-login smoke
        shell: pwsh
        run: ./scripts/smoke-installer.ps1
      - name: Smoke PostgreSQL offline pós-instalação Windows (sem terminal do cliente)
        shell: pwsh
        run: ./scripts/smoke-postgres-portable.ps1
      - name: Conferir manifesto da edição livre realmente instalada
        shell: pwsh
        run: |
          $edition = Get-Content (Join-Path $env:RUNNER_TEMP 'artisys-oficina-clean-install/resources/oficina-edition.json') -Raw | ConvertFrom-Json
          if ($edition.product -ne 'OFICINA' -or $edition.commercialActivation -ne $false) {
            throw 'O instalador da edição livre foi empacotado com ativação comercial'
          }
      - name: Gerar e testar instalador comercial separado
        shell: pwsh
        run: |
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $base = "ArtiSys-Oficina-Setup-$version-Windows-x64"
          $free = "dist-electron/$base.exe"
          $commercial = "dist-electron/$base-Commercial.exe"
          if (-not (Test-Path -LiteralPath $free)) { throw 'Instalador livre de release ausente' }
          New-Item -ItemType Directory -Path 'build/release-staging' -Force | Out-Null
          Move-Item -LiteralPath $free -Destination 'build/release-staging/free.exe'
          node scripts/stage-oficina-edition.mjs --commercial
          if ($LASTEXITCODE -ne 0) { throw 'Manifesto comercial não foi gerado' }
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao empacotar edição comercial' }
          if (-not (Test-Path -LiteralPath $free)) { throw 'Instalador comercial não foi gerado' }
          Move-Item -LiteralPath $free -Destination $commercial
          Move-Item -LiteralPath 'build/release-staging/free.exe' -Destination $free
          $installDir = Join-Path $env:RUNNER_TEMP 'artisys-oficina-commercial-install'
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          $process = Start-Process -FilePath (Resolve-Path $commercial).Path -ArgumentList @('/S',"/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS comercial falhou: $($process.ExitCode)" }
          $manifest = Join-Path $installDir 'resources/oficina-edition.json'
          if (-not (Test-Path -LiteralPath $manifest)) { throw 'Instalador comercial não contém manifesto' }
          $edition = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if ($edition.product -ne 'OFICINA' -or $edition.commercialActivation -ne $true) {
            throw 'Instalador comercial não exige ativação'
          }
          $commercialApp = Join-Path $installDir 'ArtiSys Oficina.exe'
          if (-not (Test-Path -LiteralPath $commercialApp)) {
            throw 'Executável comercial não foi instalado'
          }
          # Exercitar o binário real: sem código, o primeiro admin deve ser bloqueado.
          $originalLocal = $env:LOCALAPPDATA
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'artisys-commercial-license-smoke'
          $desktop = $null
          try {
            $desktop = Start-Process -FilePath $commercialApp -PassThru
            $ready = $false
            for ($attempt = 0; $attempt -lt 160; $attempt++) {
              Start-Sleep -Milliseconds 350
              if ($desktop.HasExited) { throw 'Oficina comercial encerrou antes de iniciar' }
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:3344/api/health' -TimeoutSec 1
                if ($health.ok -and $health.engine -eq 'postgres') { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw 'Backend comercial não respondeu' }
            $license = Invoke-RestMethod 'http://127.0.0.1:3344/api/license/status'
            if ($license.required -ne $true -or $license.active -ne $false) {
              throw 'A edição comercial não solicitou ativação antes do primeiro administrador'
            }
            $initialize = Invoke-WebRequest 'http://127.0.0.1:3344/api/setup/initialize' -Method POST -ContentType 'application/json' -Body '{}' -SkipHttpErrorCheck
            if ([int]$initialize.StatusCode -ne 403) {
              throw 'O primeiro administrador não foi bloqueado sem licença comercial'
            }
          } finally {
            if ($desktop -and -not $desktop.HasExited) {
              $null = $desktop.CloseMainWindow()
              Start-Sleep -Seconds 2
              if (-not $desktop.HasExited) { Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue }
            }
            $env:LOCALAPPDATA = $originalLocal
          }
      - name: Confirmar tag da main e versão do instalador
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          git fetch --depth=1 origin main
          if ((git rev-parse HEAD) -ne (git rev-parse FETCH_HEAD)) {
            throw 'A release deve apontar exatamente para a main validada'
          }
          $appVersion = node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version"
          if ($env:GITHUB_REF_NAME -ne "v$appVersion") {
            throw "Tag $env:GITHUB_REF_NAME diverge do package.json ($appVersion)"
          }
      - name: Gerar SHA256 do instalador aprovado
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $installers = @(
            "dist-electron/ArtiSys-Oficina-Setup-$version-Windows-x64.exe",
            "dist-electron/ArtiSys-Oficina-Setup-$version-Windows-x64-Commercial.exe"
          )
          foreach ($installer in $installers) {
            if (-not (Test-Path -LiteralPath $installer)) { throw "Instalador de release ausente: $installer" }
            $file = Get-Item -LiteralPath $installer
            $sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$sha256  $($file.Name)" | Set-Content -LiteralPath ($file.FullName + '.sha256') -Encoding ascii -NoNewline
          }
      - name: Guardar instalador e checksum após todos os smokes
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: oficina-release-${{ github.ref_name }}
          path: |
            dist-electron/ArtiSys-Oficina-Setup-*-Windows-x64*.exe
            dist-electron/ArtiSys-Oficina-Setup-*-Windows-x64*.exe.sha256
          if-no-files-found: error
          retention-days: 7

  publish-verified-release:
    name: Publicar versão verificada no GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: windows-clean-install
    runs-on: windows-latest
    permissions:
      contents: write
      checks: read
    steps:
      - name: Obter versão da main para publicar somente releases oficiais
        uses: actions/checkout@v4
      - name: Baixar artefatos aprovados
        uses: actions/download-artifact@v4
        with:
          name: oficina-release-${{ github.ref_name }}
          path: release
      - name: Aguardar todos os gates CI e QA visual no mesmo commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $required = @('quality','visual-shell (desktop)','visual-shell (mobile)','NSIS · Windows x64 limpo')
          $green = $false
          for ($attempt = 1; $attempt -le 80; $attempt++) {
            $checksJson = gh api "repos/$env:GH_REPO/commits/$env:GITHUB_SHA/check-runs?per_page=100"
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao consultar os gates no GitHub' }
            $checks = ($checksJson | ConvertFrom-Json).check_runs
            $pending = @()
            foreach ($checkName in $required) {
              $check = @($checks | Where-Object { $_.name -eq $checkName } | Sort-Object started_at -Descending | Select-Object -First 1)
              if ($check.Count -eq 0) { $pending += $checkName; continue }
              if ($check[0].status -eq 'completed' -and $check[0].conclusion -ne 'success') {
                throw "Gate obrigatório falhou: $checkName ($($check[0].conclusion))"
              }
              if ($check[0].status -ne 'completed') { $pending += $checkName }
            }
            if ($pending.Count -eq 0) { $green = $true; break }
            Write-Host "Aguardando gates: $($pending -join ', ')"
            Start-Sleep -Seconds 15
          }
          if (-not $green) { throw 'Gates incompletos, release não publicada' }
      - name: Publicar somente versão e SHA256 aprovados
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Versão deve ser SemVer estável' }
          $tag = "v$version"
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw 'Tag de release diverge do package.json'
          }
          $free = Get-Item -LiteralPath "release/ArtiSys-Oficina-Setup-$version-Windows-x64.exe"
          $commercial = Get-Item -LiteralPath "release/ArtiSys-Oficina-Setup-$version-Windows-x64-Commercial.exe"
          foreach ($installer in @($free, $commercial)) {
            $checksum = $installer.FullName + '.sha256'
            if (-not (Test-Path -LiteralPath $checksum)) { throw "SHA256 ausente: $($installer.Name)" }
            $expected = ((Get-Content -LiteralPath $checksum -Raw) -split '\s+')[0]
            $actual = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne $actual) { throw "SHA256 divergente: $($installer.Name)" }
          }
          $existing = gh release view $tag --json tagName,isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $previous = $existing | ConvertFrom-Json
            if ($previous.isDraft) { throw 'Release existente em draft exige revisão' }
            $commercialNames = @($commercial.Name,($commercial.Name + '.sha256'))
            $already = @($previous.assets | Where-Object { $commercialNames -contains $_.name })
            if ($already.Count -eq 2) {
              Write-Host "Instalador comercial $tag já publicado, sem republicação"
              exit 0
            }
            if ($already.Count -ne 0) { throw 'Release possui edição comercial incompleta; revisão necessária' }
            # v1.0.1 já possui a edição livre: acrescentar somente a comercial,
            # sem sobrescrever o instalador gratuito da atualização automática.
            gh release upload $tag $commercial.FullName ($commercial.FullName + '.sha256')
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao adicionar instalador comercial à release' }
            exit 0
          }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            gh release create $tag $free.FullName ($free.FullName + '.sha256') $commercial.FullName ($commercial.FullName + '.sha256') --verify-tag --title "ArtiSys Oficina $tag" --generate-notes
          } else {
            $tagAlreadyExists = gh api "repos/$env:GH_REPO/git/ref/tags/$tag" 2>$null
            if ($LASTEXITCODE -eq 0) { throw 'Tag existente sem release: verificar antes de publicar' }
            gh release create $tag $free.FullName ($free.FullName + '.sha256') $commercial.FullName ($commercial.FullName + '.sha256') --target $env:GITHUB_SHA --title "ArtiSys Oficina $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar GitHub Release' }
