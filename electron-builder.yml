appId: com.artisys.oficina
productName: ArtiSys Oficina
electronVersion: 43.4.1
asar: true
asarUnpack:
  - dist/src/platform/acbrlib-worker.py
  - dist/src/platform/diagnostic-worker.py
directories:
  output: dist-electron
files:
  - dist/**/*
  - electron/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ArtiSys-Oficina-Setup-${version}-Windows-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ArtiSys Oficina
  deleteAppDataOnUninstall: false
