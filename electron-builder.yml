appId: com.artisys.oficinaagro
productName: Oficina Agro
electronVersion: 43.4.1
asar: true
directories:
  output: dist-electron
files:
  - dist/**/*
  - electron/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: OficinaAgro-Setup-${version}-Windows-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Oficina Agro
  deleteAppDataOnUninstall: false
