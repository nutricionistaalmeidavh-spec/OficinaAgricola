version: 2.1

executors:
  node_linux:
    docker:
      - image: cimg/node:22.16.0
    resource_class: small
    working_directory: ~/project

jobs:
  quality:
    executor: node_linux
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Unified workshop lint, regression, build, HTTP E2E
          command: npm run ci

  qa:
    parameters:
      viewport:
        type: enum
        enum: [desktop, mobile]
    executor: node_linux
    steps:
      - checkout
      - run:
          name: Install dependencies and local Chromium
          command: |
            npm ci
            npm install --no-save --package-lock=false playwright@1.62.1
            npx playwright install --with-deps chromium
      - run:
          name: Deterministic seed
          command: |
            rm -rf .qa
            DATABASE_PATH=.qa/artisys-oficina.sqlite STORAGE_DIR=.qa/uploads node scripts/seed-qa-demo.mjs
      - run:
          name: Validate UI in << parameters.viewport >>
          command: |
            node scripts/qa-demo.mjs << parameters.viewport >> "$PWD/qa-artifacts-<< parameters.viewport >>"
      - store_artifacts:
          path: qa-artifacts-<< parameters.viewport >>
          destination: oficina-unificada/<< parameters.viewport >>

workflows:
  oficina_unificada:
    jobs:
      - quality
      - qa:
          name: qa-desktop
          viewport: desktop
          requires:
            - quality
      - qa:
          name: qa-mobile
          viewport: mobile
          requires:
            - quality
