version: 2.1

executors:
  node_linux:
    docker:
      - image: cimg/node:22.16.0
    resource_class: small
    working_directory: ~/project

commands:
  install_consumer:
    steps:
      - restore_cache:
          keys:
            - oficina-npm-v1-{{ checksum "package-lock.json" }}
            - oficina-npm-v1-
      - run:
          name: Install consumer dependencies
          command: npm ci
      - save_cache:
          key: oficina-npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  quality:
    executor: node_linux
    steps:
      - checkout
      - install_consumer
      - run:
          name: Runtime versions
          command: |
            node --version
            npm --version
      - run:
          name: Lint, tests, build and critical E2E
          command: npm run ci

  qa:
    parameters:
      viewport:
        type: enum
        enum: [desktop, mobile]
        default: desktop
    executor: node_linux
    environment:
      ARTISYS_QA_REF: "245ca2cef8678813eee83353beae91f6ad263c56"
    steps:
      - checkout
      - add_ssh_keys
      - install_consumer
      - run:
          name: Install QA system dependencies
          command: |
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg xvfb
      - run:
          name: Checkout pinned ArtiSys QA kit
          command: |
            rm -rf "$HOME/utilidades"
            git clone git@github.com:nutricionistaalmeidavh-spec/utilidades.git "$HOME/utilidades"
            git -C "$HOME/utilidades" checkout --detach "$ARTISYS_QA_REF"
            test "$(git -C "$HOME/utilidades" rev-parse HEAD)" = "$ARTISYS_QA_REF"
      - run:
          name: Install ArtiSys QA 2.4.1
          command: |
            npm ci --prefix "$HOME/utilidades/modules/artisys-qa"
            npx --prefix "$HOME/utilidades/modules/artisys-qa" playwright install --with-deps chromium
      - run:
          name: Run ArtiSys QA · << parameters.viewport >>
          command: |
            OUTPUT="$PWD/qa-artifacts-<< parameters.viewport >>"
            xvfb-run -a node "$HOME/utilidades/modules/artisys-qa/src/cli.mjs" \
              run \
              --config "$PWD/qa/artisys-qa.config.json" \
              --flow stage7-shell \
              --viewport "<< parameters.viewport >>" \
              --output "$OUTPUT"
      - store_artifacts:
          path: qa-artifacts-<< parameters.viewport >>
          destination: artisys-qa/<< parameters.viewport >>

  desktop_release:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - checkout
      - add_ssh_keys
      - run:
          name: Ensure Node 22.16+
          command: |
            $required = [Version]"22.16.0"
            try { $current = [Version](node -p "process.versions.node") } catch { $current = [Version]"0.0.0" }
            if ($current -lt $required) {
              choco install nodejs --version=22.16.0 -y --force --no-progress
              Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
              Update-SessionEnvironment
            }
            node --version
            npm --version
            $current = [Version](node -p "process.versions.node")
            if ($current -lt $required) { throw "Node 22.16.0 ou superior é obrigatório." }
      - run:
          name: Build Windows x64 installer
          command: |
            $env:CI = "true"
            & .\scripts\build-electron.ps1
      - store_artifacts:
          path: dist-electron
          destination: desktop-release
      - run:
          name: Publish retrievable release artifact
          command: |
            & .\scripts\publish-circle-artifact.ps1
      - run:
          name: Upload encrypted Drive handoff
          command: |
            & .\scripts\publish-filebin-handoff.ps1

  assistencia_quality:
    executor: node_linux
    steps:
      - checkout
      - run:
          name: Install Assistência Técnica dependencies
          command: cd apps/assistencia-tecnica && npm ci
      - run:
          name: Assistência Técnica · lint, regression, build and E2E
          command: cd apps/assistencia-tecnica && npm run ci

  assistencia_windows_build:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - checkout
      - run:
          name: Ensure Node 22.16+
          command: |
            $required = [Version]"22.16.0"
            try { $current = [Version](node -p "process.versions.node") } catch { $current = [Version]"0.0.0" }
            if ($current -lt $required) {
              choco install nodejs --version=22.16.0 -y --force --no-progress
              Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
              Update-SessionEnvironment
            }
            node --version
            npm --version
            $current = [Version](node -p "process.versions.node")
            if ($current -lt $required) { throw "Node 22.16.0 ou superior é obrigatório." }
      - run:
          name: Install Assistência Técnica dependencies
          command: |
            Set-Location 'apps\assistencia-tecnica'
            npm ci
      - run:
          name: Build Assistência Técnica application
          command: |
            Set-Location 'apps\assistencia-tecnica'
            npm run build
      - run:
          name: Build Windows x64 installer without external publish
          command: |
            Set-Location 'apps\assistencia-tecnica'
            npm install --no-save --package-lock=false electron-builder@26.15.3
            npx electron-builder --win nsis --x64 --publish never
            $exe = Get-ChildItem '.\dist-electron\AssistenciaTecnica-ArtiSys-Setup-*-Windows-x64.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $exe) { throw 'Instalador final não encontrado.' }
            if ($exe.Length -lt 1MB) { throw 'Instalador gerado com tamanho inválido.' }
            $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
            Write-Host "Arquivo: $($exe.Name)"
            Write-Host "Tamanho: $([math]::Round($exe.Length / 1MB, 2)) MB"
            Write-Host "SHA256: $hash"
      - store_artifacts:
          path: apps/assistencia-tecnica/dist-electron
          destination: assistencia-tecnica-gate

workflows:
  oficina_agricola_ci:
    jobs:
      - quality:
          filters:
            branches:
              ignore: circle-artifact
      - qa:
          name: qa-desktop
          viewport: desktop
          requires:
            - quality
          filters:
            branches:
              ignore: circle-artifact
      - qa:
          name: qa-mobile
          viewport: mobile
          requires:
            - quality
          filters:
            branches:
              ignore: circle-artifact
      - desktop_release:
          requires:
            - quality
          filters:
            branches:
              only: main
      - assistencia_quality:
          filters:
            branches:
              only: feature/assistencia-tecnica-00-08
      - assistencia_windows_build:
          requires:
            - assistencia_quality
          filters:
            branches:
              only: feature/assistencia-tecnica-00-08
