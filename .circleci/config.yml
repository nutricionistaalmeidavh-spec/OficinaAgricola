version: 2.1

executors:
  node_linux:
    docker:
      - image: cimg/node:22.16.0
    resource_class: small
    working_directory: ~/project

commands:
  install_consumer:
    steps:
      - restore_cache:
          keys:
            - oficina-npm-v1-{{ checksum "package-lock.json" }}
            - oficina-npm-v1-
      - run:
          name: Install consumer dependencies
          command: npm ci
      - save_cache:
          key: oficina-npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  quality:
    executor: node_linux
    steps:
      - checkout
      - install_consumer
      - run:
          name: Runtime versions
          command: |
            node --version
            npm --version
      - run:
          name: Lint, tests, build and critical E2E
          command: npm run ci

  qa:
    parameters:
      viewport:
        type: enum
        enum: [desktop, mobile]
        default: desktop
    executor: node_linux
    steps:
      - checkout
      - install_consumer
      - run:
          name: Install local Playwright QA runtime
          command: |
            npm install --no-save --package-lock=false playwright@1.62.1
            npx playwright install --with-deps chromium
      - run:
          name: Seed deterministic QA database
          command: |
            rm -rf .qa
            DATABASE_PATH=.qa/oficina.sqlite STORAGE_DIR=.qa/uploads node scripts/seed-qa-demo.mjs
      - run:
          name: Run local QA · << parameters.viewport >>
          command: |
            node scripts/qa-demo.mjs << parameters.viewport >> "$PWD/qa-artifacts-<< parameters.viewport >>"
      - store_artifacts:
          path: qa-artifacts-<< parameters.viewport >>
          destination: artisys-qa/<< parameters.viewport >>

  desktop_build:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - checkout
      - run:
          name: Ensure Node 22.16+
          command: |
            $required = [Version]"22.16.0"
            try { $current = [Version](node -p "process.versions.node") } catch { $current = [Version]"0.0.0" }
            if ($current -lt $required) {
              choco install nodejs --version=22.16.0 -y --force --no-progress
              Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
              Update-SessionEnvironment
            }
            node --version
            npm --version
            $current = [Version](node -p "process.versions.node")
            if ($current -lt $required) { throw "Node 22.16.0 ou superior é obrigatório." }
      - run:
          name: Install consumer dependencies
          command: npm ci
      - run:
          name: Build application
          command: npm run build
      - run:
          name: Build Windows x64 installer without external publish
          command: |
            npm install --no-save --package-lock=false electron-builder@26.15.3
            npx electron-builder --win nsis --x64 --publish never
            $exe = Get-ChildItem '.\dist-electron\OficinaAgro-Setup-*-Windows-x64.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $exe) { throw 'Instalador final não encontrado.' }
            if ($exe.Length -lt 1MB) { throw 'Instalador gerado com tamanho inválido.' }
            $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
            Write-Host "Arquivo: $($exe.Name)"
            Write-Host "Tamanho: $([math]::Round($exe.Length / 1MB, 2)) MB"
            Write-Host "SHA256: $hash"
      - store_artifacts:
          path: dist-electron
          destination: desktop-build

  desktop_publish:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - checkout
      - add_ssh_keys
      - run:
          name: Ensure Node 22.16+
          command: |
            $required = [Version]"22.16.0"
            try { $current = [Version](node -p "process.versions.node") } catch { $current = [Version]"0.0.0" }
            if ($current -lt $required) {
              choco install nodejs --version=22.16.0 -y --force --no-progress
              Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
              Update-SessionEnvironment
            }
            $current = [Version](node -p "process.versions.node")
            if ($current -lt $required) { throw "Node 22.16.0 ou superior é obrigatório." }
      - run:
          name: Rebuild release installer
          command: |
            npm ci
            npm run build
            npm install --no-save --package-lock=false electron-builder@26.15.3
            npx electron-builder --win nsis --x64 --publish never
            $exe = Get-ChildItem '.\dist-electron\OficinaAgro-Setup-*-Windows-x64.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $exe) { throw 'Instalador de release não encontrado.' }
      - run:
          name: Upload encrypted release handoff
          command: |
            & .\scripts\publish-filebin-handoff.ps1
      - run:
          name: Publish retrievable release artifact
          command: |
            & .\scripts\publish-circle-artifact.ps1

  assistencia_quality:
    executor: node_linux
    steps:
      - checkout
      - run:
          name: Install Assistência Técnica dependencies
          command: cd apps/assistencia-tecnica && npm ci
      - run:
          name: Assistência Técnica · lint, regression, build and E2E
          command: cd apps/assistencia-tecnica && npm run ci

  assistencia_windows_build:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - checkout
      - run:
          name: Ensure Node 22.16+
          command: |
            $required = [Version]"22.16.0"
            try { $current = [Version](node -p "process.versions.node") } catch { $current = [Version]"0.0.0" }
            if ($current -lt $required) {
              choco install nodejs --version=22.16.0 -y --force --no-progress
              Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
              Update-SessionEnvironment
            }
            node --version
            npm --version
            $current = [Version](node -p "process.versions.node")
            if ($current -lt $required) { throw "Node 22.16.0 ou superior é obrigatório." }
      - run:
          name: Install Assistência Técnica dependencies
          command: |
            Set-Location 'apps\assistencia-tecnica'
            npm ci
      - run:
          name: Build Assistência Técnica application
          command: |
            Set-Location 'apps\assistencia-tecnica'
            npm run build
      - run:
          name: Build Windows x64 installer without external publish
          command: |
            Set-Location 'apps\assistencia-tecnica'
            npm install --no-save --package-lock=false electron-builder@26.15.3
            npx electron-builder --win nsis --x64 --publish never
            $exe = Get-ChildItem '.\dist-electron\AssistenciaTecnica-ArtiSys-Setup-*-Windows-x64.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $exe) { throw 'Instalador final não encontrado.' }
            if ($exe.Length -lt 1MB) { throw 'Instalador gerado com tamanho inválido.' }
            $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
            Write-Host "Arquivo: $($exe.Name)"
            Write-Host "Tamanho: $([math]::Round($exe.Length / 1MB, 2)) MB"
            Write-Host "SHA256: $hash"
      - store_artifacts:
          path: apps/assistencia-tecnica/dist-electron
          destination: assistencia-tecnica-gate

workflows:
  oficina_agricola_ci:
    jobs:
      - quality:
          filters:
            branches:
              ignore: circle-artifact
            tags:
              only: /^v.*/
      - qa:
          name: qa-desktop
          viewport: desktop
          requires:
            - quality
          filters:
            branches:
              ignore: circle-artifact
      - qa:
          name: qa-mobile
          viewport: mobile
          requires:
            - quality
          filters:
            branches:
              ignore: circle-artifact
      - desktop_build:
          requires:
            - quality
          filters:
            branches:
              only: main
            tags:
              only: /^v.*/
      - desktop_publish:
          requires:
            - desktop_build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - assistencia_quality:
          filters:
            branches:
              only: feature/assistencia-tecnica-00-08
      - assistencia_windows_build:
          requires:
            - assistencia_quality
          filters:
            branches:
              only: feature/assistencia-tecnica-00-08
